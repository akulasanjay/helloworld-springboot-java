name: Deploy to AWS

on:
  # Manual trigger — go to Actions tab, click "Deploy to AWS", click "Run workflow"
  # then choose your deployment target from the dropdown
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Where do you want to deploy?'
        required: true
        type: choice
        options:
          - ECS Fargate
          - EC2
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
        type: string
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  ECR_REPOSITORY: helloworld-springboot
  ECS_CLUSTER:    helloworld-springboot-cluster
  ECS_SERVICE:    helloworld-springboot-service
  CONTAINER_NAME: helloworld-springboot

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build — always runs first regardless of deploy target
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # needed for OIDC auth with AWS

    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -q test

      - name: Build JAR
        run: mvn -q clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push image to ECR
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image URI output
        id: image
        run: |
          echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────
  # JOB 2a: Deploy to ECS Fargate
  # Only runs when deploy_target == "ECS Fargate"
  # ─────────────────────────────────────────────────────────────────
  deploy-ecs:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.deploy_target == 'ECS Fargate' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.CONTAINER_NAME }} \
            --query taskDefinition \
            --region ${{ inputs.aws_region }} \
            > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ needs.build.outputs.image_uri }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          cluster:          ${{ env.ECS_CLUSTER }}
          service:          ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: ECS deployment summary
        run: |
          echo "### ✅ Deployed to ECS Fargate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | ${{ needs.build.outputs.image_uri }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ inputs.aws_region }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Get the ALB URL:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "cd terraform && terraform output alb_dns_name" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────
  # JOB 2b: Deploy to EC2
  # Only runs when deploy_target == "EC2"
  # ─────────────────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.deploy_target == 'EC2' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Get EC2 instance ID from tag
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=helloworld-springboot-ec2" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ inputs.aws_region }})
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found EC2 instance: $INSTANCE_ID"

      - name: Deploy new image to EC2 via SSM Run Command
        run: |
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          REGION="${{ inputs.aws_region }}"
          KEY_PAIR="sanjay-key"   # your AWS key pair — used when this instance was launched

          echo "Deploying $IMAGE_URI to EC2 instance $INSTANCE_ID (key pair: $KEY_PAIR)"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "$REGION" \
            --parameters commands="[
              'aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $IMAGE_URI',
              'docker pull $IMAGE_URI',
              'docker stop helloworld-springboot || true',
              'docker rm helloworld-springboot || true',
              'docker run -d --name helloworld-springboot --restart unless-stopped -p 8080:8080 -e DEPLOYMENT_TYPE=EC2-Docker $IMAGE_URI',
              'docker ps'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

          # Show command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query '{Status:Status,Output:StandardOutputContent}'

      - name: EC2 deployment summary
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ inputs.aws_region }})

          echo "### ✅ Deployed to EC2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Instance ID** | $INSTANCE_ID |" >> $GITHUB_STEP_SUMMARY
          echo "| **Public IP** | $PUBLIC_IP |" >> $GITHUB_STEP_SUMMARY
          echo "| **Key Pair** | sanjay-key |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | ${{ needs.build.outputs.image_uri }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ inputs.aws_region }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test the app:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "curl http://$PUBLIC_IP:8080/" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SSH into the instance:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i ~/.ssh/sanjay-key.pem ec2-user@$PUBLIC_IP" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
